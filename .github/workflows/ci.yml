name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The path canonicaliser and the transport layer behave differently on
        # each of these, so all three run the full suite.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Build before test: tests/cli/binary.test.ts exercises the compiled
      # binary and skips itself when dist/ is absent.
      - name: Build the binary
        run: bun run build

      - name: Test
        run: bun test

      - name: Build the docs site
        if: matrix.os == 'ubuntu-latest'
        run: bun run docs:build

      - name: Smoke test the built binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=./dist/parley.exe; else BIN=./dist/parley; fi
          "$BIN" --version
          "$BIN" doctor
          "$BIN" status

  installer:
    name: lint the install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: POSIX syntax check
        run: sh -n install.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck install.sh

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # [ref] needs variables that already exist, and ParseFile needs a real
          # absolute path.
          $tokens = $null
          $errs = $null
          $path = (Resolve-Path ./install.ps1).Path
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errs) | Out-Null
          if ($errs -and $errs.Count -gt 0) {
            $errs | ForEach-Object {
              Write-Host "::error file=install.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)"
            }
            exit 1
          }
          Write-Host "install.ps1 parses cleanly"
